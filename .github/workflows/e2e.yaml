name: e2e

# The e2e matrix gates PRs through the required e2e-ok check; merges to
# main are not re-tested (modules are independent, and engine changes run
# the full matrix in their PR already). workflow_dispatch runs the full
# matrix on demand.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "upengine/package.json"
      - name: Detect changed modules
        id: changes
        env:
          ARGS: ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '--all' }}
        run: bun upengine/src/main.ts changed $ARGS

  e2e:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@38d47bc050dc8c5eb4a13a3e98b3a4abf23b9d11 # v0.31.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "upengine/package.json"
      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind
          config: ./test/cluster/kind.yaml
      - name: Run module e2e
        run: bun upengine/src/main.ts e2e --source ${{ matrix.module }} --registry oci://localhost:5000

  # Join job for branch protection: succeeds when all e2e legs pass
  # or when no module changed.
  e2e-ok:
    runs-on: ubuntu-latest
    needs: [detect, e2e]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "upengine/package.json"
      - name: Check e2e results
        run: bun upengine/src/main.ts join --result ${{ needs.e2e.result }}
