name: push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'schemas/**'
      - 'Makefile'
      - '.github/workflows/push.yaml'

permissions:
  contents: read

concurrency:
  group: push-modules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@dee817667ba9706be82c43de5a9f9a275490620d # v0.30.0
      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish missing module versions
        run: |
          set -euo pipefail
          failed=()
          for dir in modules/*/; do
            [ -d "$dir" ] || continue
            m="$(basename "$dir")"
            v="$(cat "modules/${m}/VERSION")"
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' <<<"$v" \
              || { echo "::error::invalid VERSION for ${m}: '${v}'"; failed+=("$m"); continue; }
            url="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/modules/${m}"
            if tags="$(timoni mod list "$url" --with-digest=false 2>&1)"; then
              if awk 'NR>1 {print $1}' <<<"$tags" | grep -Fxq "$v"; then
                echo "::notice::${m} ${v} already published, skipping"
                continue
              fi
            else
              # GHCR answers DENIED for both a missing package and bad auth,
              # so treat list failures as first-publish and let the push
              # surface real credential problems.
              echo "::warning::cannot list ${url} (first publish?)"
            fi
            echo "publishing ${m} ${v}"
            if make push-mod MODULE="$m"; then
              echo "::notice::published ${m} ${v}"
            else
              failed+=("$m")
              echo "::error::push failed for ${m} ${v}"
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failed modules: ${failed[*]}"
            exit 1
          fi
