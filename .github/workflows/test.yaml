name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@dee817667ba9706be82c43de5a9f9a275490620d # v0.30.0
      - name: Check CUE formatting
        run: make fmt-check
      - name: Vet modules
        run: make vet
      - name: Verify module metadata
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            [ -d "$dir" ] || continue
            m="$(basename "$dir")"
            v="$(cat "${dir}VERSION" 2>/dev/null)" \
              || { echo "::error::missing modules/${m}/VERSION"; exit 1; }
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' <<<"$v" \
              || { echo "::error::bad VERSION '${v}' in ${m}"; exit 1; }
            desc="$(awk 'NR>1 && !/^#/ && /[^[:space:]]/ {print; exit}' "${dir}README.md" 2>/dev/null)"
            [ -n "$desc" ] || { echo "::error::no description line in modules/${m}/README.md"; exit 1; }
            case "$desc" in
              *'"'*) echo "::error::description in modules/${m}/README.md must not contain double quotes"; exit 1;;
            esac
          done
