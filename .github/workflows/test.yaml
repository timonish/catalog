name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@bb0f07cc4f586e91d5076e63e632cab8398fef41 # v0.34.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "upengine/package.json"
      - name: Check CUE formatting
        run: make fmt-check
      - name: Install upengine dependencies
        run: make deps
      - name: Typecheck upengine
        run: make lint
      - name: Test upengine
        run: make test
      - name: Verify module metadata
        run: make lint-modules
      - name: Vet modules
        run: make vet
