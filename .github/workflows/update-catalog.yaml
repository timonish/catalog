name: update-catalog

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-sync modules even when the upstream version is unchanged
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *" # every day at 6 AM (UTC)

permissions:
  contents: read

# Overlapping runs force-push the same update/<module> branches.
concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PRs created with the default GITHUB_TOKEN do not trigger the
          # test/e2e workflows, which would deadlock auto-merge; the bot
          # credential makes the loop fully hands-free.
          token: ${{ secrets.BOT_GH_TOKEN || github.token }}
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@bb0f07cc4f586e91d5076e63e632cab8398fef41 # v0.34.0
      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "upengine/package.json"
      # The image digest resolution lists tags on the upstream registries;
      # authenticated access avoids the anonymous rate limits.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_READONLY_USER }}
          password: ${{ secrets.DOCKER_READONLY_PAT }}
      - name: Sync modules and open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_GH_TOKEN: ${{ secrets.BOT_GH_TOKEN }}
          FORCE_SYNC: ${{ inputs.force == true && '1' || '' }}
        run: bun upengine/src/main.ts update
