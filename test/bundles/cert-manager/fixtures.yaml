# A self-signed issuer and a certificate requested from it: the
# Certificate turning Ready proves the controller (issuance), webhook
# (resource admission) and cainjector (webhook CA injection) work.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: e2e-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: e2e
spec:
  secretName: e2e-tls
  commonName: e2e.example.com
  dnsNames:
    - e2e.example.com
  issuerRef:
    name: e2e-selfsigned
    kind: ClusterIssuer
