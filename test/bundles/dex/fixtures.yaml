# A Job proving the issuer serves requests through the Service: the
# OpenID Connect discovery document advertises the issuer URL.
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command:
            - sh
            - -c
            - |
              set -e
              wget -qO- http://dex.dex.svc.cluster.local:5556/.well-known/openid-configuration | grep -q '"issuer"'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
