---
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e
  namespace: node-exporter
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command:
            - /bin/sh
            - -c
            - wget -qO- http://node-exporter.node-exporter.svc:9100/metrics | grep -q node_cpu_seconds_total
